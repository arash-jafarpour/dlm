version: 2

project_name: dlm

builds:
  - id: dlm
    main: .
    binary: dlm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/arash-jafarpour/dlm/cmd.version={{ .Version }}
      - -X github.com/arash-jafarpour/dlm/cmd.commit={{ .Commit }}
      - -X github.com/arash-jafarpour/dlm/cmd.date={{ .Date }}

archives:
  - id: dlm
    # Must stay "{cmd}_{goos}_{goarch}" so the self-updater can find assets.
    # e.g. dlm_linux_amd64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  # Emit one "<asset>.sha256" per artifact; the updater's SHA2Validator
  # looks for exactly that naming before applying an update.
  split: true

changelog:
  # Generate release notes from Conventional Commits between tags and
  # group them in the GitHub release body. Users running `dlm update`
  # see exactly this text: the hand-rolled updater prints release.Body.
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.*\))?:'
      order: 10
    - title: Bug fixes
      regexp: '^.*?fix(\(.*\))?:'
      order: 20
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  # Re-releasing the same tag (e.g. after moving it) hits GitHub's 422
  # already_exists because asset names carry no version. On that error,
  # delete the conflicting asset and retry the upload.
  replace_existing_artifacts: true
